<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Org Report: One directory walk becomes a sourced, shareable executive brief.">
  <title>Org Report</title>
  <desc>One directory walk becomes a sourced, shareable executive brief.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#10b981"/>
    <stop offset="50%" stop-color="#14b8a6"/>
    <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#0f172a"/>

  <!-- Left accent ribbon -->
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <!-- Ghost watermark -->
  <text x="1180" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="100" font-weight="800" fill="#f1f5f9" opacity="0.10" text-anchor="end">ORG</text>
  <!-- Accent rule -->
  <rect x="40" y="100" width="244" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Title -->
  <text x="40" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="56" font-weight="700" fill="#f1f5f9" letter-spacing="0">Org Report</text>

  <!-- Subtitle -->
  <text x="40" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif"
      font-size="18" font-weight="600" fill="#94a3b8" letter-spacing="0">One directory walk becomes a sourced, shareable executive brief.</text>
</svg>
