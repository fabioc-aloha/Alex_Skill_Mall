name: Validate Plugin Contribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate proposed plugins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout contribution
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate changed plugin payloads
        run: npm run submit:validate -- --changed --base "${{ github.event.pull_request.base.sha }}" --allow-none

      - name: Run Mall tests
        run: npm test

      - name: Verify generated marketplace is current
        run: |
          node scripts/render-marketplace.cjs
          git diff --exit-code -- .github/plugin/marketplace.json

      - name: Validate catalog contracts
        run: npm run validate

      - name: Approval reminder
        run: echo "Automated checks passed. Plugin-related paths still require CODEOWNER approval; generated catalog refreshes may auto-merge."
